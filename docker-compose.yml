services:
  opencv:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: faceproof-api

    restart: unless-stopped

    ports:
      - "8089:8090"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
